name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # BFF (Go) — vet + race-enabled tests
  # ──────────────────────────────────────────────────────────────────────────
  bff-tests:
    name: BFF tests (Go)
    runs-on: ubuntu-latest
    # A scratch Postgres so the Postgres store tests (bff/stores_db_test.go)
    # run instead of skipping: the durable stores (BFF_SESSION_DSN), and
    # deploy/sql/bff-session-store.sql against backendkit's managed-schema
    # check, are otherwise untested. The superuser role lets the tests create
    # throwaway schemas and a non-owner role.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BFF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bff_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum

      # bff/go.mod's Go is the single source of truth (its toolchain line, or the
      # go line when there is none — go mod tidy drops a toolchain line equal to
      # the go line): fail if this job compiled with another Go, or if the
      # Dockerfile's image (what actually ships) has drifted from it.
      - name: Toolchain matches bff/go.mod (CI and Dockerfile)
        working-directory: bff
        run: |
          want=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)
          got=$(go env GOVERSION)
          image=go$(sed -nE 's/^FROM golang:([0-9.]+)-alpine.*/\1/p' Dockerfile)
          echo "go.mod toolchain: $want · CI: $got · Dockerfile: $image"
          test -n "$want" && test "$got" = "$want" && test "$image" = "$want"

      - name: Vet + race-enabled tests
        run: go vet ./... && go test -race ./...
        working-directory: bff

  # ──────────────────────────────────────────────────────────────────────────
  # BFF (Go) — golangci-lint
  # ──────────────────────────────────────────────────────────────────────────
  bff-lint:
    name: BFF golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum

      - name: Build golangci-lint with go.mod's toolchain
        # Pin the Go that builds golangci-lint to bff/go.mod's (toolchain line, or
        # the go line when there is none): `go install` outside the module would
        # otherwise pick the oldest Go satisfying golangci-lint's own
        # requirement, and that binary refuses a module targeting a newer Go.
        run: |
          echo "GOTOOLCHAIN=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' bff/go.mod)" >> "$GITHUB_ENV"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: bff
          # Build golangci-lint with bff/go.mod's toolchain: a prebuilt binary
          # compiled with an older Go refuses a module whose toolchain targets
          # a newer one. Config: bff/.golangci.yml (go-oauth2's curated set).
          install-mode: goinstall
          # Skip the action's `config verify`, which fetches a JSON schema at
          # runtime and fails CI on network blips unrelated to the code.
          verify: false

  # ──────────────────────────────────────────────────────────────────────────
  # SPA — unit tests + production build
  # ──────────────────────────────────────────────────────────────────────────
  spa:
    name: SPA unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high + critical)
        # P3-31: the SPA ships only its runtime dependencies; build tooling
        # (tailwind, vite, vitest) is dev-only and audited separately by
        # Dependabot. A failing audit here blocks the merge.
        #
        # Wrapper rather than a bare `npm audit`: the registry's advisory
        # endpoint intermittently answers 503 or a spurious 400 "Invalid
        # package tree", which a bare call cannot tell apart from a real
        # advisory. The gate retries only the no-report case and still fails
        # closed if the service never answers. See scripts/npm-audit-gate.sh.
        run: ./scripts/npm-audit-gate.sh --omit=dev

      - name: Unit tests
        run: npm run test:run

      - name: Build (production)
        run: npm run build
